{% extends 'feedback/base.html' %}
{% load static %}

{% block title %}
Home
{% endblock %}

{% block content %}
<div class="row"> 
    <div class="col-md-12">
<form method="POST">
     {% csrf_token %}
<!-- Student Name -->
<div class="mb-3">
    <label for="name" class="form-label">Student Name*</label>
    <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required>
    <div class="invalid-feedback">
        Please enter your name.
    </div>
</div>
<!-- Email Address -->
<div class="mb-3">
    <label for="email" class="form-label">Email Address*</label>
    <input type="email"
           class="form-control"
           id="email"
           name="email"
           placeholder="Enter your email address"
           required>
</div>

<!-- Degree -->
<div class="mb-3">
    <label for="degree" class="form-label">Degree*</label>
    <select class="form-select" id="degree" name="degree" required>
        <option value="" selected disabled>Select Degree</option>
        <option value="UG">UG</option>
        <option value="PG">PG</option>
    </select>
    <div class="invalid-feedback">
        Please select your degree.
    </div>
</div>

<!-- Course -->
<div class="mb-3">

    <label for="course" class="form-label">
        Course Name*
    </label>

    <select class="form-select" id="course" name="course" required>

        <option value="" selected disabled>
            Select Course
        </option>

    </select>

    <div class="invalid-feedback">
        Please select your course.
    </div>

</div>
<!-- Year -->
<div class="mb-3">
    <label for="year" class="form-label">Year*</label>
    <select class="form-select" id="year" name="year" required>
        <option value="" selected disabled>Select Year</option>
        <option value="I Year">I Year</option>
        <option value="II Year">II Year</option>
        <option value="III Year" id="thirdYear">III Year</option>
    </select>
    <div class="invalid-feedback">
        Please select your year.
    </div>
</div>

                <!-- Question 1 -->
<div class="mb-3">

    <select class="form-select" name="q1" required>

</div>

        <option value="Good">Good</option>

    </select>
</div>    
                    
<!-- Comments -->
<div class="mb-3">
    <label for="comment" class="form-label">Additional Comments / Suggestions*</label>
    <textarea class="form-control" id="comment" name="comment" rows="4"
        placeholder="Write your valuable feedback here..." required></textarea>
    <div class="invalid-feedback">
        Please provide your comments.
    </div>
</div>

<div class="d-grid">
    <button type="submit" class="btn btn-success btn-lg">
        Submit Feedback
    </button>
</div>
<script>

document.getElementById("degree").addEventListener("change", function () {

    let degree = this.value;
    let course = document.getElementById("course");
    let thirdYear = document.getElementById("thirdYear");

    // Clear old courses
    course.innerHTML = "";

    // Default option
    let defaultOption = document.createElement("option");
    defaultOption.value = "";
    defaultOption.textContent = "Select Course";
    defaultOption.disabled = true;
    defaultOption.selected = true;
    course.appendChild(defaultOption);


    if (degree === "UG") {

        let ugCourses = [
            "B.Sc Computer Science",
            "BCA",
            "B.A Tamil",
            "B.A English",
            "B.A Economics",
            "B.Com",
            "B.Sc Mathematics"
        ];

        ugCourses.forEach(function(courseName) {

            let option = document.createElement("option");

            option.value = courseName;
            option.textContent = courseName;

            course.appendChild(option);

        });

        // UG - III Year available
        thirdYear.hidden = false;

    }


    else if (degree === "PG") {

        let pgCourses = [
            "M.Sc Computer Science",
            "M.Com",
            "M.A Tamil",
            "M.A English",
            "M.Sc Mathematics"
        ];

        pgCourses.forEach(function(courseName) {

            let option = document.createElement("option");

            option.value = courseName;
            option.textContent = courseName;

            course.appendChild(option);

        });

        // PG - III Year hidden
        thirdYear.hidden = true;

    }

});

</script></form>
</div>
</div>

{% endblock %}
